apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: delta-backend
  namespace: delta
  labels:
    team: delta
spec:
  accessPolicy:
    inbound:
      rules:
        - application: delta-frontend
        - application: delta-webhook-relay
        - application: security-champion-stats-backend
          namespace: appsec
          cluster: prod-gcp
          permissions:
            roles:
              - delta.read
  image: {{image}}
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 416Mi
  replicas:
    max: 2
    min: 2
  gcp:
    sqlInstances:
      - type: POSTGRES_14
        tier: db-g1-small
        databases:
          - name: delta
  azure:
    application:
      enabled: true
      allowAllUsers: true
      claims:
        groups:
          - id: "74eafa90-c494-4913-9b96-76da786c8419"
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
  prometheus:
    enabled: true
    path: /internal/metrics
  env:
    - name: DELTA_EMAIL_ADDRESS
      value: "ikkesvar.delta@nav.no"
    # Delta maintainers: faggruppe admins, and access to features toggled to "maintainers".
    - name: DELTA_MAINTAINERS_GROUP_ID
      value: "74eafa90-c494-4913-9b96-76da786c8419"
    - name: WEBHOOK_BASE_URL
      value: "https://delta-webhook.nav.no"
    # Room booking / Teams meeting feature toggles (see docs/teams-meeting-room-booking-plan.md):
    # "off", "maintainers" (only DELTA_MAINTAINERS_GROUP_ID members, for prod testing) or "all".
    - name: FEATURE_ROOM_BOOKING
      value: "all"
    - name: FEATURE_TEAMS_MEETING
      value: "all"
    - name: FEATURE_SHARED_CALENDAR
      value: "off"
  envFrom:
    - secret: delta-backend-webhook-secret
  leaderElection: true
  liveness:
    path: /internal/is_alive
    initialDelay: 10
    timeout: 5
    periodSeconds: 5
    failureThreshold: 30
  readiness:
    path: /internal/is_ready
    initialDelay: 10
    periodSeconds: 5
    timeout: 5
