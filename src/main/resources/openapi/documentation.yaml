openapi: "3.0.3"
info:
  title: "Delta API"
  description: "API for Delta"
  version: "1.0.0"
servers:
  - url: "http://0.0.0.0:8080"
  - url: "http://delta-backend"
paths:
  /admin/event:
    put:
      tags:
        - admin
      description: >-
        Create an event. With room/Teams fields (see CreateEvent), a room booking and/or Teams
        meeting is created synchronously before the event is saved, so the response already
        contains roomStatus and the Teams details. This adds ~0.3–0.8 s to the request.
      operationId: createEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEvent'
      responses:
        "200":
          description: "Created event"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullEvent"
        "400":
          $ref: "#/components/responses/RoomTeamsBadRequest"
        "502":
          $ref: "#/components/responses/RoomTeamsBadGateway"
  /admin/event/{id}:
    delete:
      tags:
        - admin
      description: "Delete an event"
      operationId: deleteEvent
      parameters:
        - name: id
          in: path
          description: "Event id"
          required: true
          schema:
            type: string
            format: uuid
        - name: editScope
          in: query
          description: "When UPCOMING, deletes this occurrence and all following ones in the series. Defaults to SINGLE (only this event)."
          required: false
          schema:
            type: string
            enum: [SINGLE, UPCOMING]
      responses:
        "200":
          description: >-
            Event deleted. If the event had a room booking or Teams meeting, it is cancelled in
            Outlook and the room is freed (best effort; the delete succeeds even if that fails).
            This is the only way to remove a room or Teams meeting from an event.
    post:
      tags:
        - admin
      description: >-
        Change an event. Room/Teams update rules: omitted (null) roomEmail/roomName/isOnlineMeeting
        keep their current values, so a client that doesn't send them never removes a booking.
        Any change (title, time, ...) is also applied to an existing room booking/Teams meeting.
        A new roomEmail+roomName changes the room (roomStatus becomes PENDING until the room
        answers). A room cannot be removed and Teams cannot be turned off; delete the event instead.
      operationId: changeEvent
      parameters:
        - name: id
          in: path
          description: "Event id"
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEvent'
      responses:
        "200":
          description: "Event changed"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FullEvent'
        "400":
          $ref: "#/components/responses/RoomTeamsBadRequest"
        "502":
          $ref: "#/components/responses/RoomTeamsBadGateway"
  /admin/event/{id}/category:
    post:
      tags:
        - admin
        - category
      description: "Set the categories of an event"
      operationId: setCategories
      parameters:
        - name: id
          in: path
          description: "Event id"
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
      responses:
        "200":
          description: "Categories set"
  /admin/event/{id}/participant:
    delete:
      tags:
        - admin
      description: "Remove a participant from an event"
      operationId: removeParticipant
      parameters:
        - name: id
          in: path
          description: "Event id"
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailObject'
      responses:
        "200":
          description: "Participant removed"
    post:
      tags:
        - admin
      description: "Alter participant type"
      operationId: alterParticipantType
      parameters:
        - name: id
          in: path
          description: "Event id"
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeParticipant'
      responses:
        "200":
          description: "Participant type changed"
  /user/event/{id}:
    post:
      tags:
        - user
      description: "Join an event"
      operationId: joinEvent
      parameters:
        - name: id
          in: path
          description: "Event id"
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Event joined"
    delete:
      tags:
        - user
      description: "Leave an event"
      operationId: leaveEvent
      parameters:
        - name: id
          in: path
          description: "Event id"
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Event left"
  /event:
    get:
      tags:
        - general
      description: >-
        Get events. teamsJoinUrl, teamsConferenceId and teamsDialIn are null unless the caller is
        a registered participant or host of the event (isOnlineMeeting is always shown).
        M2M callers must have the delta.read application role. They can only list public events;
        onlyMine and onlyJoined are not available to M2M callers. M2M callers can instead provide
        exactly one category, participantEmail, from and to to find public events in that category
        where the email is registered as a participant and the event start is in [from, to).
        from and to are ISO local date-times. The role cannot be used to call mutation routes.
      operationId: getEvents
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: categories
          description: "Categories"
          required: false
          schema:
            type: string
        - in: query
          name: onlyFuture
          description: "Future events only"
          required: false
          schema:
            type: boolean
        - in: query
          name: onlyPast
          description: "Past events only"
          required: false
          schema:
            type: boolean
        - in: query
          name: onlyMine
          description: "Only my events"
          required: false
          schema:
            type: boolean
        - in: query
          name: onlyJoined
          description: "Only joined events"
          required: false
          schema:
            type: boolean
        - in: query
          name: participantEmail
          description: "M2M attendance lookup: email of a registered participant; requires categories, from and to"
          required: false
          schema:
            type: string
            format: email
        - in: query
          name: from
          description: "Inclusive ISO local date-time lower bound for the event start; requires categories and participantEmail"
          required: false
          schema:
            type: string
            example: "2026-10-01T00:00:00"
        - in: query
          name: to
          description: "Exclusive ISO local date-time upper bound for the event start; requires categories and participantEmail"
          required: false
          schema:
            type: string
            example: "2026-11-01T00:00:00"
      responses:
        "200":
          description: "Matching events"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FullEvent"
        "403":
          description: "M2M token is missing the delta.read application role"
        "400":
          description: >-
            onlyMine and onlyJoined are not available to M2M callers; attendance lookup parameters
            are M2M-only and require exactly one category, a valid participantEmail, and from/to
            ISO local date-times with from before to
  /event/{id}:
    get:
      tags:
        - general
      description: >-
        Get an event. teamsJoinUrl, teamsConferenceId and teamsDialIn are null unless the caller
        is a registered participant or host (isOnlineMeeting is always shown). M2M callers with
        delta.read cannot use this endpoint until the private-event visibility boundary is decided.
      operationId: getEvent
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: "Event id"
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Event details"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullEvent"
        "403":
          description: "M2M token is missing the delta.read application role"
  /features:
    get:
      tags:
        - features
      description: >-
        Which feature-toggled features are enabled for the calling user. Use this to show/hide
        the room picker and the Teams toggle. Sending room/Teams fields or calling /rooms when a
        feature is disabled returns 400.
      operationId: getFeatures
      responses:
        "200":
          description: "Enabled features for the caller"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Features"
  /rooms:
    get:
      tags:
        - rooms
      description: "Room lists (typically one per building). Cached on the server for 24 hours."
      operationId: getRoomLists
      responses:
        "200":
          description: "Room lists"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomList"
        "400":
          description: "Room booking is not enabled for the caller"
        "502":
          description: "Microsoft Graph failed; retry later"
  /rooms/search:
    get:
      tags:
        - rooms
      description: >-
        Search all rooms in the tenant by name or email. Case-insensitive; every term must
        match, in any order; punctuation is ignored. "fya1 a347" or "kaptein" both find
        "(RV) FYA1 - A347 Kaptein - Videokonf". Rooms with a word starting with the first term
        come first. The full room list is cached on the server for 24 hours.
      operationId: searchRooms
      parameters:
        - name: q
          in: query
          required: true
          description: "Search text, at least 2 characters"
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: "Max results, 1–100"
          schema:
            type: integer
            default: 25
      responses:
        "200":
          description: "Matching rooms"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomInfo"
        "400":
          description: "Room booking is not enabled for the caller, or q is shorter than 2 characters"
        "502":
          description: "Microsoft Graph failed; retry later"
  /rooms/{roomListEmail}:
    get:
      tags:
        - rooms
      description: "Rooms in a room list. Cached on the server for 24 hours per list."
      operationId: getRooms
      parameters:
        - name: roomListEmail
          in: path
          description: "emailAddress of a RoomList from GET /rooms"
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Rooms"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomInfo"
        "400":
          description: "Room booking is not enabled for the caller"
        "502":
          description: "Microsoft Graph failed; retry later"
  /rooms/availability:
    post:
      tags:
        - rooms
      description: "Free/busy for one or more rooms in a time range. Not cached."
      operationId: getRoomAvailability
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomAvailabilityRequest"
      responses:
        "200":
          description: "Availability per room"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomAvailability"
        "400":
          description: >-
            Room booking is not enabled for the caller, roomEmails is empty or has more than 20
            entries, startTime is not before endTime, the range exceeds 62 days, or
            availabilityViewInterval is outside 5–1440
        "502":
          description: "Microsoft Graph failed; retry later"
  /category:
    get:
      tags:
        - category
      description: >-
        Get all categories. M2M callers must have the delta.read application role. This role
        cannot be used to call mutation routes.
      operationId: getCategories
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "All categories"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "403":
          description: "M2M token is missing the delta.read application role"
    put:
      tags:
        - category
      description: "Create a category"
      operationId: createCategory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategory'
      responses:
        "200":
          description: "Created category"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
  /api/faggrupper:
    get:
      tags:
        - faggrupper
      description: "Get all active faggrupper"
      operationId: getFaggrupper
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "All active faggrupper"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FaggruppeDTO"
    post:
      tags:
        - faggrupper
      description: "Create a faggruppe. Caller is added as the first owner."
      operationId: createFaggruppe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaggruppeCreateDTO'
      responses:
        "201":
          description: "Faggruppe created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaggruppeDTO"
  /api/faggrupper/{id}:
    get:
      tags:
        - faggrupper
      description: "Get a single faggruppe by ID"
      operationId: getFaggruppe
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Faggruppe found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaggruppeDTO"
        "404":
          description: "Faggruppe not found"
    put:
      tags:
        - faggrupper
      description: "Update a faggruppe. Requires owner or admin."
      operationId: updateFaggruppe
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaggruppeUpdateDTO'
      responses:
        "200":
          description: "Faggruppe updated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaggruppeDTO"
        "403":
          description: "Forbidden — not an owner or admin"
        "404":
          description: "Faggruppe not found"
    delete:
      tags:
        - faggrupper
      description: "Delete a faggruppe and all its owners. Requires owner or admin."
      operationId: deleteFaggruppe
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: "Faggruppe deleted"
        "403":
          description: "Forbidden — not an owner or admin"
        "404":
          description: "Faggruppe not found"
  /api/faggrupper/{id}/eier:
    get:
      tags:
        - faggrupper
      description: "Check if the authenticated user is an owner"
      operationId: isEier
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Owner status"
          content:
            application/json:
              schema:
                type: object
                properties:
                  isOwner:
                    type: boolean
  /api/faggrupper/{id}/eiere:
    get:
      tags:
        - faggrupper
      description: "List all owners of a faggruppe."
      operationId: getEiere
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "List of owners"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EierDTO"
        "404":
          description: "Faggruppe not found"
    post:
      tags:
        - faggrupper
      description: "Add an owner to the faggruppe. Requires owner or admin."
      operationId: addEier
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddEierDTO'
      responses:
        "200":
          description: "Owner added"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EierDTO"
        "403":
          description: "Forbidden — not an owner or admin"
        "404":
          description: "Faggruppe not found"
        "409":
          description: "Conflict — email is already an owner"
  /api/faggrupper/{id}/eiere/{epost}:
    delete:
      tags:
        - faggrupper
      description: "Remove an owner. Requires owner or admin."
      operationId: removeEier
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: epost
          in: path
          required: true
          description: "URL-encoded email address of the owner to remove"
          schema:
            type: string
            format: email
      responses:
        "204":
          description: "Owner removed"
        "403":
          description: "Forbidden — not an owner or admin"
        "404":
          description: "Faggruppe or owner not found"
components:
  responses:
    RoomTeamsBadRequest:
      description: >-
        Plain-text reason. Room/Teams-related messages: "Room booking is not enabled",
        "Teams meeting is not enabled", "roomEmail and roomName must be set together",
        "Room booking and Teams meetings are not supported for recurring events",
        "Teams meeting cannot be removed from an event; delete the event instead".
      content:
        text/plain:
          schema:
            type: string
    RoomTeamsBadGateway:
      description: >-
        Creating/updating the room booking or Teams meeting in Microsoft Graph failed, or Graph
        created no Teams join link ("Teams meeting could not be created; nothing was saved").
        Nothing was saved; the event is unchanged. Safe to retry.
      content:
        text/plain:
          schema:
            type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateEvent:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        location:
          type: string
        public:
          type: boolean
        signupDeadline:
          type: string
          format: date-time
        participantLimit:
          type: integer
        sendNotificationEmail:
          type: boolean
        categories:
          type: array
          items:
            type: integer
          nullable: true
        recurrence:
          $ref: "#/components/schemas/RecurrenceRequest"
          nullable: true
        editScope:
          type: string
          enum: [SINGLE, UPCOMING]
          nullable: true
        roomEmail:
          type: string
          nullable: true
          description: >-
            Room to book (feature toggled, see docs/teams-meeting-room-booking-plan.md). Rejected
            with 400 if the caller does not have room booking enabled, if roomName is not sent
            with it, or on a recurring event. On update, null keeps the current room; a
            different value changes it. A room cannot be removed; delete the event instead.
        roomName:
          type: string
          nullable: true
          description: Display name of the room. Must be sent together with roomEmail.
        isOnlineMeeting:
          type: boolean
          nullable: true
          description: >-
            Opt-in Teams meeting (feature toggled). Rejected with 400 if the caller does not have
            Teams meetings enabled, or on a recurring event. On update, null keeps the current
            value. Once enabled it cannot be turned off (false returns 400); delete the event
            instead. Server-managed fields (roomStatus, teamsJoinUrl, teamsConferenceId,
            teamsDialIn) are ignored if sent.
    Event:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        location:
          type: string
        id:
          type: string
          format: uuid
        public:
          type: boolean
        signupDeadline:
          type: string
          format: date-time
        participantLimit:
          type: integer
        roomEmail:
          type: string
          nullable: true
          description: "Booked room, null if none. Always present (stable contract), also when the feature is off."
        roomName:
          type: string
          nullable: true
        roomStatus:
          type: string
          enum: [PENDING, ACCEPTED, DECLINED]
          nullable: true
          description: >-
            The room's answer to the booking. Null when there is no room. PENDING until the room
            answers (usually seconds, updated in the background). DECLINED means the room is not
            booked (e.g. already taken); the host is not emailed, so the frontend should show it.
            Server-managed.
        isOnlineMeeting:
          type: boolean
          description: "Whether the event has a Teams meeting."
        teamsJoinUrl:
          type: string
          nullable: true
          description: >-
            Teams join link. Null when there is no Teams meeting, or when the caller is not a
            registered participant/host. Server-managed.
        teamsConferenceId:
          type: string
          nullable: true
          description: "Teams audio conference ID. Same visibility as teamsJoinUrl. Server-managed."
        teamsDialIn:
          type: string
          nullable: true
          description: >-
            Dial-in number (with quick-dial suffix when available). Null if the tenant has no
            Audio Conferencing. Same visibility as teamsJoinUrl. Server-managed.
    Features:
      type: object
      properties:
        roomBooking:
          type: boolean
        teamsMeeting:
          type: boolean
    RoomList:
      type: object
      properties:
        displayName:
          type: string
          nullable: true
        emailAddress:
          type: string
          nullable: true
    RoomInfo:
      type: object
      properties:
        displayName:
          type: string
          nullable: true
          description: "Use as roomName (and typically as location) when booking"
        emailAddress:
          type: string
          nullable: true
          description: "Use as roomEmail when booking"
        capacity:
          type: integer
          nullable: true
        building:
          type: string
          nullable: true
        floorLabel:
          type: string
          nullable: true
        isWheelChairAccessible:
          type: boolean
          nullable: true
    RoomAvailabilityRequest:
      type: object
      required:
        - roomEmails
        - startTime
        - endTime
      properties:
        roomEmails:
          type: array
          items:
            type: string
        startTime:
          type: string
          format: date-time
          description: "Local time (Europe/Oslo), same format as event times"
        endTime:
          type: string
          format: date-time
        availabilityViewInterval:
          type: integer
          default: 30
          minimum: 5
          maximum: 1440
          description: "Slot length in minutes"
    RoomAvailability:
      type: object
      properties:
        emailAddress:
          type: string
        availabilityView:
          type: string
          nullable: true
          description: >-
            One character per availabilityViewInterval slot from startTime: 0 = free,
            1 = tentative, 2 = busy, 3 = out of office, 4 = working elsewhere.
        error:
          type: string
          nullable: true
          description: "Set when Graph could not return availability for this room"
    FullEvent:
      type: object
      properties:
        event:
          $ref: "#/components/schemas/Event"
        participants:
          type: array
          items:
            $ref: "#/components/schemas/Participant"
        hosts:
          type: array
          items:
            $ref: "#/components/schemas/Participant"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        recurringSeries:
          $ref: "#/components/schemas/RecurringSeriesSummary"
          nullable: true
    RecurrenceRequest:
      type: object
      required:
        - frequency
        - untilDate
      properties:
        frequency:
          type: string
          enum: [WEEKLY, BIWEEKLY, MONTHLY]
        untilDate:
          type: string
          format: date
        signupDeadlineOffsetDays:
          type: integer
          minimum: 1
          maximum: 365
          nullable: true
          description: "Days before each occurrence's start time to set as signup deadline"
    RecurringSeriesSummary:
      type: object
      properties:
        seriesId:
          type: string
          format: uuid
        frequency:
